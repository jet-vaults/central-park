<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Park | 404</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/brand/logo_mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: var(--gutter); }
    .nf__logo { height: 4rem; width: auto; margin-inline: auto; color: var(--c-paper); }
    .nf__code { display: block; font-size: var(--fs-display); font-weight: var(--fw-bold); line-height: 1; color: var(--c-gold); margin-block: var(--space-5) var(--space-3); }
    .nf a { display: inline-block; margin-block-start: var(--space-4); padding-block: .5rem; border-block-end: 1px solid var(--c-gold); font-weight: var(--fw-regular); }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img class="nf__logo" src="/assets/brand/logo_mark.svg" alt="Central Park" width="61" height="55">
      <span class="nf__code" lang="en">404</span>
      <p>העמוד המבוקש לא נמצא.</p>
      <a href="/">לעמוד הבית</a>
    </div>
  </main>
</body>
</html>
